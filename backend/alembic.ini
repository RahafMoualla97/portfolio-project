# Alembic configuration for database migrations

[alembic]
# Path to the Alembic scripts directory
script_location = alembic

# Prepend system path for module imports
prepend_sys_path = .

# Version path separator for file names
version_path_separator = os

# Database connection URL (used for migrations)
# Uses environment variable DATABASE_URL for security and flexibility
sqlalchemy.url = ${DATABASE_URL}


# ============================================
# POST-WRITE HOOKS (Code formatting)
# ============================================

[post_write_hooks]
# Run Black formatter after generating migration files
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88


# ============================================
# LOGGING CONFIGURATION
# ============================================

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic


# ============================================
# ROOT LOGGER
# ============================================

[logger_root]
level = WARN
handlers = console
qualname =


# ============================================
# SQLALCHEMY LOGGER
# ============================================

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


# ============================================
# ALEMBIC LOGGER
# ============================================

[logger_alembic]
level = INFO
handlers =
qualname = alembic


# ============================================
# CONSOLE HANDLER
# ============================================

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# ============================================
# LOG FORMATTER
# ============================================

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S